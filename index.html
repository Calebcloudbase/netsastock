<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetsaStock - Inventory System</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

  <!-- Main App Header -->
  <header class="bg-indigo-600 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <h1 class="text-2xl font-bold tracking-wide">NetsaStock</h1>
        <span class="text-xs bg-indigo-500 px-2 py-1 rounded-full uppercase tracking-wider font-semibold">v1.0</span>
      </div>
      <div class="flex items-center space-x-4 text-sm">
        <span>Spare Parts & Stock Management</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

    <!-- Top Dashboard Stat Cards -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs font-semibold uppercase text-gray-500">Total Items</p>
        <p id="stat-total-items" class="text-2xl font-bold text-gray-800 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs font-semibold uppercase text-gray-500">Total Quantity in Stock</p>
        <p id="stat-total-qty" class="text-2xl font-bold text-indigo-600 mt-1">0</p>
      </div>
      <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
        <p class="text-xs font-semibold uppercase text-gray-500">Estimated Total Value</p>
        <p id="stat-total-value" class="text-2xl font-bold text-green-600 mt-1">$0.00</p>
      </div>
    </section>

    <!-- Form Section: Add / Edit Item -->
    <section class="bg-white p-6 rounded-lg shadow-sm border border-gray-200">
      <h2 class="text-lg font-semibold text-gray-800 mb-4 flex items-center gap-2">
        <span>Add New Spare Part / Stock Item</span>
      </h2>
      <form id="add-item-form" class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Part Name</label>
          <input type="text" id="item-name" required placeholder="e.g. Brake Pad / Filter" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Quantity</label>
          <input type="number" id="item-qty" required min="1" placeholder="0" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Unit Price ($)</label>
          <input type="number" id="item-price" step="0.01" required placeholder="0.00" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm" />
        </div>
        <div class="flex items-end">
          <button type="submit" id="submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md text-sm transition shadow-sm">
            + Add Stock
          </button>
        </div>
      </form>
    </section>

    <!-- Inventory Display Table -->
    <section class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="p-4 border-b border-gray-200 bg-gray-50 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <h2 class="text-lg font-semibold text-gray-800">Current Inventory List</h2>
        <div class="flex items-center gap-2">
          <input type="text" id="search-input" placeholder="Search inventory..." class="px-3 py-1.5 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-gray-600">
          <thead class="bg-gray-100 uppercase text-xs text-gray-500 border-b border-gray-200">
            <tr>
              <th class="py-3 px-4">Item Name</th>
              <th class="py-3 px-4">Quantity</th>
              <th class="py-3 px-4">Unit Price</th>
              <th class="py-3 px-4">Total Value</th>
              <th class="py-3 px-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="inventory-table-body" class="divide-y divide-gray-200">
            <tr>
              <td colspan="5" class="text-center py-8 text-gray-400">Loading live inventory from Firebase...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Firebase Modular Engine Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // Project credentials
    const firebaseConfig = {
      apiKey: "AIzaSyABPTqss3yx7Ktq88P4EHS57C_DuYGWxbY",
      authDomain: "netsastock-e285b.firebaseapp.com",
      projectId: "netsastock-e285b",
      storageBucket: "netsastock-e285b.firebasestorage.app",
      messagingSenderId: "15480432977",
      appId: "1:15480432977:web:0a8a22d2ba8816b4c10b70",
      measurementId: "G-SJXPT9K9XX"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;

    const inventoryRef = collection(db, "inventory");

    // UI Elements
    const form = document.getElementById("add-item-form");
    const nameInput = document.getElementById("item-name");
    const qtyInput = document.getElementById("item-qty");
    const priceInput = document.getElementById("item-price");
    const tableBody = document.getElementById("inventory-table-body");
    const searchInput = document.getElementById("search-input");

    const statItems = document.getElementById("stat-total-items");
    const statQty = document.getElementById("stat-total-qty");
    const statValue = document.getElementById("stat-total-value");

    let inventoryData = [];

    // 1. Listen for real-time updates from Firestore
    onSnapshot(inventoryRef, (snapshot) => {
      inventoryData = [];
      snapshot.forEach((docSnap) => {
        inventoryData.push({ id: docSnap.id, ...docSnap.data() });
      });
      renderTable(inventoryData);
      updateStats(inventoryData);
    });

    // 2. Render table rows
    function renderTable(items) {
      if (items.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="5" class="text-center py-8 text-gray-400">No items found in stock. Add your first item above!</td>
          </tr>`;
        return;
      }

      tableBody.innerHTML = items.map(item => {
        const totalVal = (Number(item.qty) * Number(item.price)).toFixed(2);
        return `
          <tr class="hover:bg-gray-50 transition">
            <td class="py-3 px-4 font-medium text-gray-800">${item.name}</td>
            <td class="py-3 px-4">${item.qty}</td>
            <td class="py-3 px-4">$${Number(item.price).toFixed(2)}</td>
            <td class="py-3 px-4 font-semibold text-gray-700">$${totalVal}</td>
            <td class="py-3 px-4 text-right">
              <button onclick="deleteStockItem('${item.id}')" class="text-red-500 hover:text-red-700 font-medium text-xs px-2 py-1 rounded hover:bg-red-50 transition">
                Delete
              </button>
            </td>
          </tr>`;
      }).join('');
    }

    // 3. Update dashboard stat cards
    function updateStats(items) {
      const totalCount = items.length;
      const totalQuantity = items.reduce((sum, item) => sum + Number(item.qty || 0), 0);
      const totalValuation = items.reduce((sum, item) => sum + (Number(item.qty || 0) * Number(item.price || 0)), 0);

      statItems.textContent = totalCount;
      statQty.textContent = totalQuantity;
      statValue.textContent = `$${totalValuation.toFixed(2)}`;
    }

    // 4. Handle Form Submission to write to Firebase
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const newItem = {
        name: nameInput.value.trim(),
        qty: Number(qtyInput.value),
        price: Number(priceInput.value),
        createdAt: new Date().toISOString()
      };

      try {
        await addDoc(inventoryRef, newItem);
        form.reset();
      } catch (err) {
        console.error("Error adding item: ", err);
        alert("Failed to save item. Please check connection.");
      }
    });

    // 5. Delete Item function exposed globally
    window.deleteStockItem = async (id) => {
      if (confirm("Are you sure you want to remove this stock item?")) {
        try {
          await deleteDoc(doc(db, "inventory", id));
        } catch (err) {
          console.error("Error deleting item: ", err);
        }
      }
    };

    // 6. Search filtering
    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = inventoryData.filter(item => item.name.toLowerCase().includes(query));
      renderTable(filtered);
    });
  </script>
</body>
</html>
